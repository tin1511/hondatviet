<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#0c0a09"/>
  <!-- Gold gradient frame -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8"/>
  <!-- Traditional Vietnamese Heritage Temple Roof & AI Circuit Motif -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof Tier 1 -->
    <path d="M 96 240 C 160 210, 200 210, 256 160 C 312 210, 352 210, 416 240 L 416 260 C 352 230, 312 230, 256 185 C 200 230, 160 230, 96 260 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Roof Tier 2 Top -->
    <path d="M 160 170 C 200 150, 220 150, 256 120 C 292 150, 312 150, 352 170 L 352 185 C 312 165, 292 165, 256 138 C 220 165, 200 165, 160 185 Z" fill="url(#goldGrad)" opacity="0.95"/>
    <!-- Pillars & Base -->
    <rect x="156" y="260" width="200" height="110" rx="6" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="6"/>
    <!-- Center Arch Gate -->
    <path d="M 216 370 L 216 300 C 216 270, 296 270, 296 300 L 296 370 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <line x1="120" y1="370" x2="392" y2="370" stroke-width="10"/>
    <line x1="96" y1="388" x2="416" y2="388" stroke-width="12"/>
    <!-- AI Sparkle / Star on Top -->
    <path d="M 256 60 L 263 85 L 288 92 L 263 99 L 256 124 L 249 99 L 224 92 L 249 85 Z" fill="#fbbf24"/>
  </g>
</svg>
